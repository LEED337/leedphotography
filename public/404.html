<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var root = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/';

      sessionStorage.setItem(
        'redirect',
        l.pathname.slice(pathSegmentsToKeep ? l.pathname.indexOf('/', 1) : 0) + l.search + l.hash
      );

      l.replace(root + '?/' + l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash);
    </script>
  </head>
  <body></body>
</html>
